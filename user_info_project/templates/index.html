
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information Form</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'style.css' %}">
  
</head>
<body class="home-body">
  <div class="main">
    <div class="form-section">
      <div class="inner-form">
  <h1>User Registration Form</h1>
  <form action="/" method="POST">
    {% csrf_token %}
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" name="first_name" required><br><br>
  
    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" name="last_name" required><br><br>
  
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>
  
    <button type="submit">Submit</button>
    <button type="button" onclick=get_data()>Get</button>
  </form>
  {% if form.errors %}
    <div style="color: red;">
        <h3>Form errors:</h3>
        <pre>{{ form.errors }}</pre>
    </div>
  {% elif form.non_field_errors %}
    <div class="error">Message sent successfully</div>
  {% endif %}

  
    
  </div>
  </div>
  </div>
  
</body>
<script>
  function get_data(){
    window.location.href = "/get_data";
  }
</script>
</html>
