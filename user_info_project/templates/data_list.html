{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data List</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <div class="main">
    <div class="userdata-section">
      <div class="inner-userdata">

        <h1>REGISTERED USERS</h1>
       
        <form method="POST" action="{% url 'delete_users' %}" id="deleteForm">
          {% csrf_token %}
         

          <a class="back-cls" href="/">Back to Home</a>
          <table border="1">
            <thead>
              <tr>
                <th style="display: none;" class="checkbox-header">Select</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Actions</th>  
              </tr>
            </thead>
            <tbody>
              {% for user in data %}
              <tr>
                <td style="display: none;" class="checkbox-cell">
                  <input type="checkbox" name="delete_ids" value="{{ user.id }}" class="deleteCheckbox">
                </td>
                <td>{{ user.first_name }}</td>
                <td>{{ user.last_name }}</td>
                <td>{{ user.email }}</td>
                <td class="update-td">
                  <a href="{% url 'update_user' user.id %}" class="update-btn">Update</a> <!-- Update Button -->
                </td>
              </tr>
              {% empty %}
              <tr>
                <td colspan="5">No data available</td>
              </tr>
              {% endfor %}
            </tbody>            
          </table>
          <button class="deletd-btn" type="submit" id="confirmDelete" style="display: none;">Confirm Delete</button>
        </form>
         <!-- Delete Button -->
         <button class="deletd-btn" id="showDeleteOptions">Delete</button>
         
        
       
        
        
          

      </div>
    </div>
  </div>

  <script>
    document.getElementById("showDeleteOptions").addEventListener("click", function () {
        let checkboxes = document.querySelectorAll(".deleteCheckbox");
        let confirmDelete = document.getElementById("confirmDelete");
        let checkboxCells = document.querySelectorAll(".checkbox-cell");
        let checkboxHeader = document.querySelector(".checkbox-header");

        checkboxes.forEach(checkbox => {
            checkbox.style.display = "inline";  
        });

        checkboxCells.forEach(cell => {
            cell.style.display = "table-cell";  
        });

        checkboxHeader.style.display = "table-cell"; 
        confirmDelete.style.display = "inline";
        this.style.display = "none";  
    });
  </script>

</body>
</html>
